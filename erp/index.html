<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduERP — College Management System</title>
<meta name="description" content="EduERP — a lightweight college ERP: students, faculty, courses, attendance and fees." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="brand big">◆ EduERP</div>
    <p class="login-sub">College Management System</p>
    <form id="login-form">
      <label>Username
        <input name="username" autocomplete="username" required placeholder="admin" />
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      </label>
      <button type="submit" class="btn primary block">Sign in</button>
      <p id="login-error" class="login-error"></p>
    </form>
    <div class="demo-creds">
      <strong>Demo accounts</strong>
      <code>admin / admin123</code> (full access)<br />
      <code>faculty / faculty123</code> (attendance only)
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">◆ EduERP</div>
    <nav id="nav">
      <a href="#/dashboard" data-nav="dashboard">📊 Dashboard</a>
      <a href="#/students" data-nav="students">🎓 Students</a>
      <a href="#/faculty" data-nav="faculty">👩‍🏫 Faculty</a>
      <a href="#/courses" data-nav="courses">📚 Courses</a>
      <a href="#/attendance" data-nav="attendance">✅ Attendance</a>
      <a href="#/fees" data-nav="fees">💰 Fees</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <span id="user-name" class="user-name"></span>
        <span id="user-role" class="user-role"></span>
      </div>
      <button class="btn ghost small" data-action="reset-data">Reset demo data</button>
      <button class="btn ghost small danger-text" data-action="logout">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="view-title">Dashboard</h1>
      <span class="topbar-date" id="topbar-date"></span>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<!-- ============ MODAL ============ -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-title">Title</h3>
      <button class="modal-close" data-action="modal-cancel" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="toast"></div>

<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
